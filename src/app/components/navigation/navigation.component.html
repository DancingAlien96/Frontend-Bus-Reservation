<mat-sidenav-container class="sidenav-container">
	<mat-sidenav
		#drawer
		class="sidenav"
		fixedInViewport
		[attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
		[mode]="(isHandset$ | async) ? 'over' : 'side'"
		[opened]="(isHandset$ | async) === false"
	>
		<div class="menu-content">
			<mat-toolbar>Menu</mat-toolbar>
			<mat-nav-list>
				<div class="menu-options">
					@for (item of this.menuOption; track $index) {

					<a mat-list-item routerLink="{{ item.rute }}" (click)="whenClick(item.name)">
						<mat-icon>{{ item.icon }}</mat-icon> {{ item.name }}
					</a>
					}
				</div>
			</mat-nav-list>
			<div logoutOption class="logout-option">
				<a mat-list-item routerLink="{{ logoutOption.rute }}" (click)="whenClick(logoutOption.name)">
					<mat-icon class="logout-icon">{{ logoutOption.icon }}</mat-icon> <strong> {{ logoutOption.name }}</strong>
				</a>
			</div>
		</div>
	</mat-sidenav>
	<mat-sidenav-content>
		<mat-toolbar color="primary">
			@if (isHandset$ | async) {
			<button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
				<mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
			</button>
			}
			<div class="toolbar">
				<div><span>Sistema de Solicitudes de Vehículos de CUNORI</span></div>
				<button mat-button [matMenuTriggerFor]="menu" class="userinfo-button">
					<div class="userinfo">
						<mat-list>
							<mat-list-item class="userinfo-item">
								<span class="username" matListItemTitle>{{ usuario.USERNAME }}</span>
								<span class="role" matListItemLine>{{ usuario.ROL.NOMBRE | uppercase }}</span>
							</mat-list-item>
						</mat-list>
						<mat-icon class="account_icon">account_circle</mat-icon>
					</div>
				</button>
				<mat-menu #menu="matMenu">
					<button mat-menu-item routerLink="profile"><mat-icon>settings</mat-icon>Mi perfil</button>
				</mat-menu>
			</div>
		</mat-toolbar>
		<router-outlet />
		<!-- Add Content Here -->
	</mat-sidenav-content>
</mat-sidenav-container>
