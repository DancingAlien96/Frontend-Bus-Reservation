<mat-sidenav-container class="sidenav-container">
	<mat-sidenav
		#drawer
		class="sidenav"
		fixedInViewport
		[attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
		[mode]="(isHandset$ | async) ? 'over' : 'side'"
		[opened]="(isHandset$ | async) === false"
	>
		<mat-toolbar>Menu</mat-toolbar>
		<mat-nav-list>
			@for (item of this.menuOption; track $index) {
				
				<a mat-list-item routerLink="{{ item.rute }}" (click)="whenClick(item.idoption)">
					<mat-icon>{{ item.icon }}</mat-icon> {{ item.name }}
					
				</a>
				}
		</mat-nav-list>
	</mat-sidenav>
	<mat-sidenav-content>
		<mat-toolbar color="primary">
			@if (isHandset$ | async) {
			<button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
				<mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
			</button>
			}
			<div class="toolbar">

				<div><span>Gestión de Solicitudes de Vehículos Universitarios</span></div>
				 <div class="avatar-container">
					<img    class="avatar-image" src="https://material.angular.io/assets/img/examples/shiba1.jpg" alt="Avatar"/>
				</div> 
				
				
			</div>
		</mat-toolbar>
		<router-outlet />
		<!-- Add Content Here -->
	</mat-sidenav-content>
</mat-sidenav-container>
