<div mat-dialog-content class="confirm-dialog-content">
	@switch (data.type) { @case (0) {
	<mat-icon class="confirm-dialog-icon" [className]="'type-' + data.type">error</mat-icon>
	} @case (1) {
	<mat-icon class="confirm-dialog-icon" [className]="'type-' + data.type">warning</mat-icon>
	} @case (2) {
	<mat-icon class="confirm-dialog-icon" [className]="'type-' + data.type">check_circle</mat-icon>
	} }
	<h2 class="confirm-dialog-title" [className]="'type-' + data.type">{{ data.title }}</h2>
	<p class="confirm-dialog-message">{{ data.message }}</p>
</div>

<mat-dialog-actions align="end">
	<div class="buttons-container">
		<button *ngIf="data.type === 1" mat-button (click)="cancelar()" class="cancel-button">Cancelar</button>
		<button mat-button color="warn" (click)="confirmar()" class="confirm-button">Aceptar</button>
	</div>
</mat-dialog-actions>
