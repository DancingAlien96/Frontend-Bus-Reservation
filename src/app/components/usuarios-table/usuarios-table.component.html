<mat-card appearance="outlined">
	
	<mat-divider></mat-divider>
	<mat-card-content>
		<div class="container">
			
			<mat-form-field>
				<mat-label>Buscar</mat-label>
				<input matInput (keyup)="applyFilter($event)" placeholder="Ex.Usuario" #input />
			</mat-form-field>

			<div class="mat-elevation-z8">
				<table mat-table [dataSource]="dataSource" matSort>

                    <!-- ID_USUARIO Column -->
					<ng-container matColumnDef="ID_USUARIO">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>No.</th>
						<td mat-cell *matCellDef="let row">{{ row.ID_USUARIO }}</td>
					</ng-container>

					<!--CUI Column -->
					<ng-container matColumnDef="CUI">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>DPI</th>
						<td mat-cell *matCellDef="let row">{{ row.CUI}}</td>
					</ng-container>

					<!-- NOMBRE_COMPLETO Column -->
					<ng-container matColumnDef="NOMBRE_COMPLETO">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
						<td mat-cell *matCellDef="let row">{{ row.NOMBRE_COMPLETO }}</td>
					</ng-container>


					<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
					<tr class="stylerow" mat-row *matRowDef="let row; columns: displayedColumns"></tr>

					<!-- Row shown when there is no matching data. -->
					<tr class="mat-row" *matNoDataRow>
						<td class="mat-cell" colspan="6">No hay datos relacionados al filtro.</td>
					</tr>
				</table>

				<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
			</div>
		</div>
	</mat-card-content>
</mat-card>
