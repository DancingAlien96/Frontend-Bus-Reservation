<mat-card appearance="outlined">
	<mat-card-header>
		<mat-card-title> Usuarios </mat-card-title>
		<button *ngIf="rol != 3" mat-raised-button color="primary" routerLink="/nuevo-usuario">
			<mat-icon>person_add</mat-icon> Nuevo usuario
		</button>
	</mat-card-header>
	<mat-divider></mat-divider>
	<mat-card-content>
		<div class="container">
			<mat-form-field>
				<mat-label>Buscar</mat-label>
				<input matInput (keyup)="applyFilter($event)" placeholder="Ex.Usuario" #input />
			</mat-form-field>

			<div class="mat-elevation-z8">
				<table mat-table [dataSource]="dataSource" matSort>
					<!-- ID_USUARIO Column -->
					<ng-container matColumnDef="ID_USUARIO">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>No.</th>
						<td mat-cell *matCellDef="let row">{{ row.ID_USUARIO }}</td>
					</ng-container>

					<!--USERNAME Column -->
					<ng-container matColumnDef="USERNAME">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre de Usuario</th>
						<td mat-cell *matCellDef="let row">{{ row.USERNAME }}</td>
					</ng-container>

					<!-- NOMBRE_COMPLETO Column -->
					<ng-container matColumnDef="NOMBRE_COMPLETO">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
						<td mat-cell *matCellDef="let row">{{ row.NOMBRE_COMPLETO }}</td>
					</ng-container>

					<!-- CORREO Column -->
					<ng-container matColumnDef="CORREO">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
						<td mat-cell *matCellDef="let row">{{ row.CORREO }}</td>
					</ng-container>

					<!-- ROL Column -->
					<ng-container matColumnDef="ROL">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
						<td mat-cell *matCellDef="let row">{{ row.ROL.NOMBRE }}</td>
					</ng-container>

					<!-- ESTADO Column -->
					<ng-container matColumnDef="ESTADO">
						<th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>

						<td mat-cell *matCellDef="let row">
							<div [ngClass]="row.ACTIVO === true ? 'status-active' : 'status-not-active'">
								<span [ngClass]="'dot ' + (row.ACTIVO | usuarioActivoPipe)"></span>
								{{ row.ACTIVO | usuarioActivoPipe }}
							</div>
						</td>
					</ng-container>

					<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
					<tr (click)="openDialog(row)" class="stylerow" mat-row *matRowDef="let row; columns: displayedColumns"></tr>

					<!-- Row shown when there is no matching data. -->
					<tr class="mat-row" *matNoDataRow>
						<td class="mat-cell" colspan="6">No hay datos relacionados al filtro.</td>
					</tr>
				</table>

				<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
			</div>
		</div>
	</mat-card-content>
</mat-card>
